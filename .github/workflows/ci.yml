name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check geoeco api tests

      - name: Unit tests
        run: pytest -q

      - name: Leakage test (spatial blocks disjoint)
        run: pytest -q tests/test_leakage.py -v
