name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks scan (secrets)
        uses: gitleaks/gitleaks-action@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install (test closure only — see pyproject [test] extra)
        run: |
          pip install "ruff==0.16.10" pytest numpy pandas pyyaml fastapi httpx sqlalchemy pydantic scikit-learn
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: |
          set +e
          python -m ruff check geoeco api tests 2>&1 | tee ruff.log
          code=${PIPESTATUS[0]}
          # Full ruff.log is printed to the step console (uncapped). ONE
          # multi-line annotation mirrors it (GitHub only surfaces ~10
          # annotations per step): the whole log when it fits GitHub's
          # ~64 KB per-annotation cap, else the last 200 lines — run #30's
          # tail -40 hid 10 of its 13 errors.
          if [ "$(wc -c < ruff.log)" -le 60000 ]; then
            msg=$(sed ':a;N;$!ba;s/\n/%0A/g; s/\r//g' ruff.log)
          else
            msg=$(tail -200 ruff.log | sed ':a;N;$!ba;s/\n/%0A/g; s/\r//g')
          fi
          echo "::error::$msg"
          exit $code

      - name: Unit tests
        run: |
          set +e
          pytest -q --tb=short > pytest.log 2>&1
          code=$?
          # ONE multi-line annotation: GitHub shows only the first ~10 error
          # annotations per step, so 40 separate ::error:: lines would hide
          # the failure summary. Newlines become %0A (carriage returns
          # stripped). Pytest output here is paths + assertion text only —
          # no secrets pass through this step.
          msg=$(tail -40 pytest.log | sed ':a;N;$!ba;s/\n/%0A/g; s/\r//g')
          echo "::error::$msg"
          exit $code

      - name: Labelling pipeline tests (schema, overlap, qgz, prelabel, merge)
        run: pytest -q tests/test_labelling.py -v

      - name: Leakage test (spatial blocks disjoint)
        run: pytest -q tests/test_leakage.py -v
