name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks scan (secrets)
        uses: gitleaks/gitleaks-action@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check geoeco api tests

      - name: Unit tests
        run: |
          set +e
          pytest -q --tb=short > pytest.log 2>&1
          code=$?
          # Mirror the tail as error annotations: readable via the public
          # API (check-run annotations need no login), unlike step logs.
          tail -40 pytest.log | sed 's/^/::error::/'
          exit $code

      - name: Labelling pipeline tests (schema, overlap, qgz, prelabel, merge)
        run: pytest -q tests/test_labelling.py -v

      - name: Leakage test (spatial blocks disjoint)
        run: pytest -q tests/test_leakage.py -v
