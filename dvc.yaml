stages:
  # TODO(M1): no CLI yet — geoeco/ingest/export.py is library-only
  # (no `if __name__ == "__main__"`, no argparse). Non-blocking no-op until
  # the ingest CLI lands (owner: geoeco/ stream).
  ingest:
    cmd: 'echo TODO-M1: ingest has no runnable CLI yet — skipping'
    deps:
      - geoeco/ingest/
      - configs/aoi/hyderabad.yaml
      - configs/data/sentinel.yaml
    outs:
      - data/raw/composites/
    params:
      - configs/data/sentinel.yaml

  # TODO(M1): no CLI yet — geoeco/features/build.py does not exist, and
  # geoeco/features/sampling.py has no `__main__`/argparse. Non-blocking
  # no-op until the features CLI lands (owner: geoeco/ stream).
  features:
    cmd: 'echo TODO-M1: features has no runnable CLI yet — skipping'
    deps:
      - geoeco/features/
      - data/raw/composites/
    outs:
      - data/processed/feature_stack/
      - data/processed/stac/catalog.json

  # TODO(M1): no CLI yet — geoeco/features/sampling.py is library-only
  # (no `__main__`/argparse). Non-blocking no-op until the sampling CLI
  # lands (owner: geoeco/ stream).
  sample:
    cmd: 'echo TODO-M1: sampling has no runnable CLI yet — skipping'
    deps:
      - geoeco/features/sampling.py
      - geoeco/labels/
      - data/processed/feature_stack/
    outs:
      - data/processed/points.parquet
      - data/processed/chips/

  # OK — geoeco/labels/pipeline.py:248 (--stage sample|split|all, --config)
  # and geoeco/labels/qgis.py:134 (no required flags) both have CLIs.
  labelling:
    cmd: python -m geoeco.labels.pipeline --stage all && python -m geoeco.labels.qgis
    deps:
      - geoeco/labels/
      - configs/labels/labelling.yaml
      - configs/aoi/hyderabad.yaml
      - configs/eval/spatial_cv.yaml
    outs:
      - data/labels/hyd_sampling_skeleton.geojson
      - data/labels/members/
      - data/labels/overlap_index.csv
      - data/labels/qgis/
    params:
      - configs/labels/labelling.yaml

  # OK (flags fixed to match real CLIs) —
  # geoeco/train/train_classical.py:85 requires --points plus
  # --model M1|M2|M3|M3-lgbm|M5 (a model ID, not a yaml path);
  # geoeco/train/train_seg.py:146 requires --stage + --data with
  # --model M6|M7|M8|M9. Configs configs/model/rf.yaml (M5-class RF) and
  # configs/model/unet.yaml (M6) document hyperparams, not CLI input.
  train:
    cmd: python -m geoeco.train.train_classical --points data/processed/points.parquet --model M5 --seed 42 && python -m geoeco.train.train_seg --stage hyd_finetune --data data/processed/chips/ --model M6
    deps:
      - geoeco/models/
      - geoeco/train/
      - data/processed/points.parquet
      - data/processed/chips/
    outs:
      - models/
    metrics:
      - metrics/train.json:
          cache: false

  # TODO(M1): no CLI yet — geoeco/infer/tiled_inference.py is library-only
  # (no `__main__`/argparse). Non-blocking no-op until the infer CLI lands
  # (owner: geoeco/ stream).
  infer:
    cmd: 'echo TODO-M1: infer has no runnable CLI yet — skipping'
    deps:
      - geoeco/infer/
      - models/
      - data/processed/feature_stack/
    outs:
      - data/outputs/maps/

  # TODO(M1): no CLI yet — geoeco/analytics/change.py and
  # geoeco/analytics/indicators.py are library-only (no `__main__`/argparse).
  # Non-blocking no-op until analytics CLIs land (owner: geoeco/ stream).
  analytics:
    cmd: 'echo TODO-M1: analytics has no runnable CLI yet — skipping'
    deps:
      - geoeco/analytics/
      - data/outputs/maps/
    outs:
      - data/outputs/change/
      - data/outputs/indicators/

  # TODO(M1): no CLI yet — geoeco/evaluation/spatial_cv.py is library-only
  # (no `__main__`/argparse). Non-blocking no-op until the evaluation CLI
  # lands (owner: geoeco/ stream).
  evaluate:
    cmd: 'echo TODO-M1: evaluation has no runnable CLI yet — skipping'
    deps:
      - geoeco/evaluation/
      - data/outputs/maps/
    metrics:
      - metrics/eval.json:
          cache: false
