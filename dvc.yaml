stages:
  # OK — geoeco/ingest/export.py:296 (main with --config/--data/--out/--seed/
  # --dry-run). Exits 2 without EE creds after writing the export manifest.
  ingest:
    cmd: python -m geoeco.ingest.export --config configs/aoi/hyderabad.yaml --data configs/data/sentinel.yaml
    deps:
      - geoeco/ingest/
      - configs/aoi/hyderabad.yaml
      - configs/data/sentinel.yaml
    outs:
      - data/raw/composites/
    params:
      - configs/data/sentinel.yaml

  # OK — geoeco/features/build.py:107 (--config/--out/--composites-dir).
  # Refuses (exit 1) until the ingest stage produces data/raw/composites/.
  features:
    cmd: python -m geoeco.features.build --config configs/data/sentinel.yaml
    deps:
      - geoeco/features/
      - data/raw/composites/
    outs:
      - data/processed/feature_stack/
      - data/processed/stac/catalog.json

  # OK — geoeco/features/sampling.py has a --config CLI printing the CV plan.
  sample:
    cmd: python -m geoeco.features.sampling --config configs/eval/spatial_cv.yaml
    deps:
      - geoeco/features/sampling.py
      - geoeco/labels/
      - data/processed/feature_stack/
    outs:
      - data/processed/points.parquet
      - data/processed/chips/

  # OK — geoeco/labels/pipeline.py:248 (--stage sample|split|all, --config)
  # and geoeco/labels/qgis.py:134 (no required flags) both have CLIs.
  labelling:
    cmd: python -m geoeco.labels.pipeline --stage all && python -m geoeco.labels.qgis
    deps:
      - geoeco/labels/
      - configs/labels/labelling.yaml
      - configs/aoi/hyderabad.yaml
      - configs/eval/spatial_cv.yaml
    outs:
      - data/labels/hyd_sampling_skeleton.geojson
      - data/labels/members/
      - data/labels/overlap_index.csv
      - data/labels/qgis/
    params:
      - configs/labels/labelling.yaml

  # OK (flags fixed to match real CLIs) —
  # geoeco/train/train_classical.py:85 requires --points plus
  # --model M1|M2|M3|M3-lgbm|M5 (a model ID, not a yaml path);
  # geoeco/train/train_seg.py:146 requires --stage + --data with
  # --model M6|M7|M8|M9. Configs configs/model/rf.yaml (M5-class RF) and
  # configs/model/unet.yaml (M6) document hyperparams, not CLI input.
  train:
    cmd: python -m geoeco.train.train_classical --points data/processed/points.parquet --model M5 --seed 42 && python -m geoeco.train.train_seg --stage hyd_finetune --data data/processed/chips/ --model M6
    deps:
      - geoeco/models/
      - geoeco/train/
      - data/processed/points.parquet
      - data/processed/chips/
    outs:
      - models/
    metrics:
      - metrics/train.json:
          cache: false

  # OK — geoeco/infer/tiled_inference.py:174 (--aoi/--model/--stack/--out,
  # 256-px tiles, 32-px overlap; --smoke proves the blend path). Refuses
  # (exit 1) until models/ and the feature stack exist.
  infer:
    cmd: python -m geoeco.infer.tiled_inference --aoi configs/aoi/hyderabad.yaml --model models/ --stack data/processed/feature_stack/ --out data/outputs/maps/
    deps:
      - geoeco/infer/
      - models/
      - data/processed/feature_stack/
    outs:
      - data/outputs/maps/

  # OK — geoeco/analytics/change.py:116 (--from/--to required) and
  # indicators.py. Both refuse (exit 1) until classified maps exist.
  analytics:
    cmd: python -m geoeco.analytics.change --from 2019 --to 2025 && python -m geoeco.analytics.indicators
    deps:
      - geoeco/analytics/
      - data/outputs/maps/
    outs:
      - data/outputs/change/
      - data/outputs/indicators/

  # OK — geoeco/evaluation/spatial_cv.py:103 (--config; GroupKFold smoke with
  # disjointness proof, no data required).
  evaluate:
    cmd: python -m geoeco.evaluation.spatial_cv --config configs/eval/spatial_cv.yaml
    deps:
      - geoeco/evaluation/
      - data/outputs/maps/
    metrics:
      - metrics/eval.json:
          cache: false
