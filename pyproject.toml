[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoeco"
version = "0.1.0"
description = "Multi-sensor (S1+S2) ecosystem mapping: Hyderabad + Telangana/AP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Batch 58" }]
dependencies = [
  "earthengine-api>=0.1.412",
  "geemap>=0.34",
  "numpy>=1.26",
  "pandas>=2.2",
  "geopandas>=1.0",
  "rasterio>=1.3",
  "pystac>=1.10",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "torch>=2.3",
  "pytorch-lightning>=2.2",
  "segmentation-models-pytorch>=0.3.3",
  "torchgeo>=0.6",
  "mlflow>=2.12",
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "hydra-core>=1.3",
  "pyyaml>=6.0",
  "dvc>=3.55",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]
# Test-only closure for `pytest tests/` (verified: full suite passes with ONLY
# these + the repo on sys.path — no torch/lightning/mlflow/geemap needed).
# CI installs this as an explicit package list plus `pip install -e . --no-deps`
# (see .github/workflows/ci.yml): extras are ADDITIVE, so `.[test]` alone would
# still pull the heavy base `dependencies` — the explicit list is what keeps CI
# light. Contributors wanting the full runtime: `pip install -e ".[dev]"`.
# Keep in sync with the test import closure.
test = [
  "pytest>=8.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geoeco*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
