# M7 dual-branch U-Net: optical encoder + SAR encoder -> fused bottleneck+skips -> shared decoder.
model: dualbranch
family: deep_feature_fusion

optical_branch: { encoder: resnet34, in_channels: 14, weights: imagenet }
sar_branch: { encoder: resnet34, in_channels: 4, weights: imagenet }
terrain: { mode: concat_at_bottleneck, channels: 2 }
fusion: { where: [bottleneck, skips], how: concat_conv }
decoder: { type: unet, num_classes: 6 }

optim:
  name: AdamW
  lr_encoder: 0.0001
  lr_decoder: 0.001
  weight_decay: 0.01
  scheduler: cosine
  epochs: [50, 100]
  batch_size: [8, 16]
  mixed_precision: true
  loss: "weighted_ce+dice"

augment:
  flips: true
  rot90: true
  brightness_jitter_optical_only: true
  modality_dropout: 0.2

seed: 42
framework: pytorch_lightning
