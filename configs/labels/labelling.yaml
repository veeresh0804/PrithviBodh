# Hyderabad labelling pipeline parameters (M2).
# All labelling-geometry choices live here — pipeline code reads this file,
# never hard-codes. Seed MUST equal configs/eval/spatial_cv.yaml seed
# (pipeline asserts this and fails loudly otherwise).
seed: 42

splits:
  test: 2000
  train: 1500

# Fold (block) scheme. Task orders block IDs B0-B4; folds are 5 contiguous
# longitude bands (~11.9 km each). NOTE: band width exceeds the
# configs/eval/spatial_cv.yaml 3-10 km range — logged as a provisional
# deviation in docs/label_run_report.md. Fine cells below stay in-range.
folds: ["B0", "B1", "B2", "B3", "B4"]
test_folds: ["B0", "B1", "B2"]
train_folds: ["B3", "B4"]

# Fine grid for the `fine_block` column. Provisional: semivariogram range not
# computed yet (config gives range 3-10 km); 5 km is inside the range.
fine_block_size_m: 5000

# 10% of points double-labelled, spread across members and folds
# (spread across *classes* is impossible pre-labelling — classes are unknown
# until humans label; post-labelling balance check covers this).
overlap_fraction: 0.10

# Roster (sourced from PROJECT_CONTEXT.md §7.1, 3 members -> ~1,200 pts each).
members:
  - { id: "A", name: "V D S S M Veeresh" }
  - { id: "B", name: "Sandhya Malavath" }
  - { id: "C", name: "Sehwag Lavudiya" }

# Must match the protocol gate (geoeco/labels/agreement.py passes_gate default).
agreement_threshold: 0.85

# Class scheme reference only — labels are ALWAYS human-filled (never auto).
classes_ref: "configs/data/sentinel.yaml:classes_default6"

# QGIS workspace sources (public tile endpoints; S2 export expected locally).
s2_post_monsoon_cog: "data/raw/composites/s2_post_2025.tif"
admin_boundary: "data/admin/hyderabad_boundary.geojson"

# Grid design (ADOPTED 2026-10-06; seed accepted via seed_check gates).
# Band `seed: 42` above is frozen for record; grid uses its own stream.
grid_seed: 5
grid_cells:
  test: 48
  train: 36
# Sliver exclusion: cells covering less than this fraction of a full
# fine_block_size_m cell (the maxlat-clamped northern edge sliver, ~42 m tall
# vs 5 km -> fraction ~0.008) are unassignable and hold no points; they act
# as implicit buffer. Threshold 0.5 keeps every interior/edge cell (smallest
# non-sliver is the last column at ~0.9 width) while excluding only the sliver
# row. Read by geoeco/labels/grid.py assign_cells (never hard-coded).
min_cell_area_fraction: 0.5
# Zone edges (km from the urban core) for zone-stratified cell assignment:
# core < 10 km, mid 10-25 km, far > 25 km. The core edge doubles as the
# seed-acceptance core_radius_km, so assignment zones and acceptance gates
# stratify the same geography. Read by grid.assign_cells_zoned.
zone_edges_km: [10.0, 25.0]

# Seed-acceptance rule (covariate balance ONLY — never model accuracy). Any
# grid-draw skeleton must pass ALL three gates below, checked by
# `python -m geoeco.labels.seed_check --skeleton <path>` (see
# geoeco/labels/seed_check.py). A draw is accepted only on gates computed from
# point coordinates (distance-to-centre proxy + longitude spread + core
# presence). Thresholds were CALIBRATED from an 8-draw pilot scan (mean-dist
# gaps 1.4-10.9 km, ~25% passing at 5.0 km) + buffer-distance reasoning (see
# per-gate notes), THEN frozen before the acceptance scans (seed 42 rejected,
# seed 3 rejected post-fix, seed 4 quota-fail, seed 5 accepted). Changing any
# threshold now requires a dated comment + re-running the checker on the
# accepted seed, never silent tuning.
seed_acceptance:
  # Urban core point. Mirrors configs/aoi/hyderabad.yaml center (17.38N 78.48E);
  # duplicated here so the rule is self-contained.
  core_lon: 78.48
  core_lat: 17.38
  # GATE 1 — core_both_sides ("core cell on BOTH sides", defined precisely):
  # "core cell" = the fine_block_size_m grid cell containing
  # (core_lon, core_lat) under geoeco/labels/grid.py build_cells geometry
  # (origin at AOI minlon/minlat; seed-42 id is g05_06 — diagnostic only, the
  # gate itself is radius-based so it works on ANY skeleton including bands).
  # Operational gate: EACH split must place >= min_core_share_per_side share
  # of its OWN configured split total (labelling.yaml `splits:`, read by the
  # checker — never hard-coded) within core_radius_km of the core point.
  # "Core-adjacent" therefore means "within core_radius_km", NOT an 8-neighbour
  # cell: the grid design enforces a one-cell 8-neighbourhood buffer between
  # opposite sides, so a test core cell can NEVER touch a train 8-neighbour by
  # construction — an 8-neighbour gate would be unsatisfiable.
  # core_radius_km = 10.0 = 2x fine_block_size_m: the minimum radius that CAN
  # hold both a test and a train cell (core cell + buffer ring + nearest
  # opposite-side cell). Threshold 0.05 (5%): test needs >= 100 of 2000,
  # train >= 75 of 1500 (ceil of share x configured split total).
  # CHOSEN POST-HOC 2026-10-06 — NOT pre-registered: set AFTER observing the
  # seed-6 zoned draw (test 177 / train 123 within 10 km). Disclosed here, not
  # back-dated. Rationale: a side's urban signal below ~5% share is noise in
  # per-class F1 bootstrap CIs. Replaces the old absolute floor (>= 1 pt),
  # which became meaningless once zoned assignment constructs balance.
  core_radius_km: 10.0
  min_core_share_per_side: 0.05
  # GATE 2 — mean_dist_gap: |mean_dist_test - mean_dist_train| <= threshold,
  # where mean_dist_* is the audit-A3 proxy (mean haversine km to the core
  # point, same numbers as data/labels/audit/stats.json distance_proxy_km).
  # Threshold 5.0 km = one fine_block_size_m = the leakage-buffer distance: a
  # larger mean offset means the sides live in systematically different
  # distance shells, a regime shift bigger than the buffer itself. Scale
  # context: ~1/6 of the AOI half-width (30 km), ~1/8 of max centre-corner
  # distance (~42 km). Pilot scan of 8 grid draws gave gaps 1.4-10.9 km with
  # ~25% passing at 5.0 km — the gate bites (rejects seed 42's 8.39 km) but is
  # satisfiable (seeds 3, 999 pass), so it is neither vacuous nor impossible.
  max_mean_dist_gap_km: 5.0
  # GATE 3 — lon_band_span: split the AOI longitude range (from hyderabad.yaml
  # bounds_wgs84) into n_lon_bands equal bands (5 = the existing B0-B4 folds,
  # ~11.9 km each — no new geometry invented). A side "spans" a band if it
  # holds >= min_points_per_band points there; EACH side must span >=
  # min_bands_per_side bands. 4/5 ~= 48 of 60 km east-west presence: tolerates
  # one buffer-induced gap (all 8 pilot grid draws span >= 4) while catching
  # hard east/west splits — the band design spans only 3 (test) and 2 (train)
  # and fails. Span is existence (>= 1 pt); balance is GATE 2's job.
  n_lon_bands: 5
  min_bands_per_side: 4
  min_points_per_band: 1
