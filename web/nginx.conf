# Same-origin API reverse proxy: the browser bundle calls /api/* and nginx
# strips the /api prefix when forwarding to the FastAPI `api` service, so the
# static bundle needs no per-environment rebuild (no baked VITE_API_URL).
# One image serves all environments; only this proxy target (the compose
# service name + port) is deployment-specific, and it is stable by default.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
